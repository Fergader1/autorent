spring.application.name=autorent

# Conexion a la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:autorent
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear las tablas al iniciar y eliminarlas al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Habilitar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false